<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Недвижимость Средиземноморья">
  <defs>
    <radialGradient id="bg" cx="34%" cy="24%" r="78%">
      <stop offset="0" stop-color="#12375F"/>
      <stop offset="0.55" stop-color="#071D35"/>
      <stop offset="1" stop-color="#03101F"/>
    </radialGradient>
    <linearGradient id="gold" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.42" stop-color="#D6A849"/>
      <stop offset="0.72" stop-color="#B98525"/>
      <stop offset="1" stop-color="#FFE08A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular premium badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="28.4" fill="none" stroke="url(#gold)" stroke-width="2.4"/>
  <circle cx="32" cy="32" r="24.8" fill="none" stroke="#D6A849" stroke-opacity="0.18" stroke-width="1"/>

  <!-- House + sea wave mark -->
  <g filter="url(#shadow)" fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- roof -->
    <path d="M18 29.5 L32 17 L46 29.5" stroke-width="4.2"/>
    <!-- house sides -->
    <path d="M22.5 28.2 V39.2 M41.5 28.2 V39.2" stroke-width="3.4"/>
    <!-- chimney -->
    <path d="M39.5 23.5 V18.8 H43.5 V27.2" stroke-width="3.2"/>
    <!-- compact window -->
    <path d="M29 28 H35 M32 25 V31" stroke-width="2.2"/>
    <!-- Mediterranean waves -->
    <path d="M16 42.5 C23.5 35.5 30.5 47.2 39 40.2 C42.2 37.5 45.2 37.2 49 39" stroke-width="4"/>
    <path d="M18 49 C25 43.2 31.5 53 39.2 47.3 C42.1 45.1 45.5 44.7 49.5 46.4" stroke-width="3.2" opacity="0.92"/>
  </g>

  <!-- subtle highlight -->
  <path d="M10 23 C15 9 30 5 42 10" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2" stroke-linecap="round"/>
</svg>
